<?xml version="1.0" encoding="UTF-8"?>
<!-- Placeholder/inline SVG logo added to repository so the site shows a nicely styled mark.
     Replace this file with the provided PNG (images/guernsey-harpsichord-trust-logo.png) if you want the photographic logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Guernsey Harpsichord Trust logo">
  <defs>
    <style>
      .bg{ fill: #ffffff }
      .ring{ fill: none; stroke: #423626; stroke-width: 12 }
      .title{ font-family: 'EB Garamond', serif; font-size: 42px; fill: #14213d; font-weight:700 }
      .sub{ font-family: 'Space Mono', monospace; font-size: 14px; fill: #6d7377 }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%" rx="8"/>
  <circle cx="300" cy="300" r="270" class="ring"/>
  <!-- simplified harpsichord-ish shape -->
  <g transform="translate(120,120) scale(0.8)">
    <rect x="60" y="40" width="340" height="140" rx="6" fill="#b85a2f" stroke="#423626" stroke-width="3"/>
    <rect x="68" y="50" width="324" height="40" fill="#f4f1e6"/>
    <rect x="68" y="90" width="270" height="30" fill="#e5d7c0"/>
    <rect x="320" y="90" width="72" height="40" fill="#c58b63"/>
    <rect x="140" y="180" width="180" height="14" fill="#423626"/>
  </g>
  
  <text x="300" y="420" text-anchor="middle" class="title">GUERNSEY</text>
  <text x="300" y="468" text-anchor="middle" class="title">HARPSICHORD</text>
  <text x="300" y="508" text-anchor="middle" class="title">TRUST</text>
</svg>
